spring:
  application:
    name: order-service
  datasource:
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:shopflow}
    username: ${DB_USER:shopflow}
    password: ${DB_PASSWORD:shopflow}
  jpa:
    open-in-view: false
    show-sql: true
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  cache:
    redis:
      time-to-live: 10m
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all

shopflow:
  kafka:
    topics:
      order-events: shopflow.order-events
  payment:
    sbp:
      merchant-id: ${SBP_MERCHANT_ID:MA0000012345}
      qr-base-url: ${SBP_QR_BASE_URL:https://sbp-sandbox.shopflow.test/qr}
    crypto:
      currency: BTC
      rub-rate: ${CRYPTO_BTC_RUB_RATE:9000000}
      fee-percent: 1.5

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
